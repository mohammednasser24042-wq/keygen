<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexora ERP | Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .brand-logo p {
            margin: 8px 0 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text-main);
            font-size: 13px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"], input[type="password"], input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 600;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .result-area {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: #f1f5f9;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            color: #0f172a;
            direction: ltr;
            text-align: left;
            font-weight: 600;
        }

        .action-btns {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .btn-sec {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .btn-sec:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .logout-btn {
            background: #fee2e2;
            border: none;
            color: #ef4444;
            font-weight: 700;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #fecaca;
        }

        #generatorScreen {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        
        <!-- = شاشة تسجيل الدخول الفخمة = -->
        <div id="loginScreen">
            <div class="brand-logo">
                <h1>APEXORA</h1>
                <p>بوابة إدارة وتوليد التراخيص المشفرة</p>
            </div>
            
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم..." autocomplete="off">
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور...">
            </div>

            <button type="button" class="btn-primary" onclick="checkLogin()">تسجيل الدخول</button>
        </div>

        <!-- = شاشة التوليد الرئيسية = -->
        <div id="generatorScreen">
            <div class="top-bar">
                <div>
                    <h3 style="margin:0; font-size:16px; color:var(--primary);">مرحباً، بالمطور</h3>
                    <span style="font-size:11px; color:var(--text-muted);">النظام جاهز للتوليد</span>
                </div>
                <button type="button" class="logout-btn" onclick="logout()">تسجيل خروج</button>
            </div>

            <div class="brand-logo" style="margin-bottom: 20px;">
                <h1 style="font-size: 20px;">Key Generator</h1>
            </div>

            <div class="form-group">
                <label>سريال هارد العميل (HDD)</label>
                <input type="text" id="clientHDD" placeholder="مثال: W-DXW1E8045173" autocomplete="off">
            </div>

            <div class="form-group">
                <label>تاريخ انتهاء الاشتراك</label>
                <input type="date" id="expiryDate">
            </div>

            <button type="button" class="btn-primary" onclick="processGeneration()">توليد كود التفعيل</button>

            <div class="result-area" id="resultContainer">
                <label>ملف التفعيل النهائي (Apexora.lic)</label>
                <textarea id="resultText" readonly></textarea>
                <div class="action-btns">
                    <button type="button" class="btn-sec" onclick="copyResult()">📋 نسخ</button>
                    <button type="button" class="btn-sec" onclick="downloadLicFile()">💾 تحميل</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const ADMIN_USER = "admin";
const ADMIN_PASS = "apexora2026";

function checkLogin() {
    let u = document.getElementById("username").value.trim();
    let p = document.getElementById("password").value.trim();

    if (u === ADMIN_USER && p === ADMIN_PASS) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("generatorScreen").style.display = "block";
    } else {
        alert("بيانات الدخول غير صحيحة!");
    }
}

function logout() {
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("generatorScreen").style.display = "none";
    document.getElementById("loginScreen").style.display = "block";
}

function parseArabicNumbers(str) {
    return str.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function GenerateLicenseKey(hardwareID, expiryDate) {
    let rawData = hardwareID.trim().toUpperCase() + "|" + expiryDate;
    let masterKey = "ApexoraSec2026_MasterKey#99!";
    let dynamicKey = masterKey + hardwareID.trim().toUpperCase();
    let hexResult = "";

    for (let i = 1; i <= rawData.length; i++) {
        let charCode = rawData.charCodeAt(i - 1);
        let dynChar = dynamicKey.charCodeAt(((i - 1) % dynamicKey.length));
        charCode = charCode ^ dynChar;
        charCode = (charCode + (i * 7)) % 256;
        let masChar = masterKey.charCodeAt((masterKey.length - ((i - 1) % masterKey.length)) - 1);
        charCode = charCode ^ masChar;

        let hexVal = charCode.toString(16).toUpperCase();
        if (hexVal.length < 2) hexVal = "0" + hexVal;
        hexResult += hexVal;
    }

    if (hexResult.length >= 20) {
        return "APX-" + hexResult.substring(0, 5) + "-" + hexResult.substring(5, 10) + "-" + hexResult.substring(10, 15) + "-" + hexResult.substring(15);
    } else {
        return "APX-" + hexResult;
    }
}

function processGeneration() {
    try {
        let hddInput = document.getElementById("clientHDD").value;
        let dateInput = document.getElementById("expiryDate").value;

        if (!hddInput || !hddInput.trim()) {
            alert("الرجاء إدخال سريال هارد العميل أولاً!");
            return;
        }

        if (!dateInput) {
            alert("الرجاء اختيار تاريخ انتهاء الاشتراك!");
            return;
        }

        let cleanHDD = parseArabicNumbers(hddInput.trim());
        let finalKey = GenerateLicenseKey(cleanHDD, dateInput);
        let fullFileContent = "---APEXORA OFFICIAL LICENSE FILE---\n" + finalKey;

        document.getElementById("resultText").value = fullFileContent;
        document.getElementById("resultContainer").style.display = "block";

    } catch (err) {
        alert("حدث خطأ أثناء المعالجة: " + err.message);
    }
}

function copyResult() {
    let txt = document.getElementById("resultText");
    txt.select();
    navigator.clipboard.writeText(txt.value).then(() => {
        alert("تم النسخ بنجاح!");
    });
}

function downloadLicFile() {
    let content = document.getElementById("resultText").value;
    let blob = newBlob = new Blob([content], { type: "text/plain;charset=utf-8" });
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Apexora.lic";
    a.click();
}
</script>

</body>
</html>
