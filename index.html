<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexora ERP | Enterprise Security Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: radial-gradient(circle at center, #111827 0%, #030712 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 38px 32px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(79, 70, 229, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-shadow: 0 0 35px rgba(79, 70, 229, 0.3);
        }

        .brand-logo p {
            margin: 6px 0 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0e7ff;
            color: #3730a3;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text-main);
            font-size: 13px;
        }

        input[type="text"], input[type="password"], input[type="date"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 600;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 22px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(79, 70, 229, 0.35);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(79, 70, 229, 0.45);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .result-area {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            background-color: #f1f5f9;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            color: #0f172a;
            direction: ltr;
            text-align: left;
            font-weight: 600;
        }

        .action-btns {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .btn-sec {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .btn-sec:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .btn-sec:active {
            transform: scale(0.97);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        .logout-btn {
            background: #fee2e2;
            border: none;
            color: #ef4444;
            font-weight: 700;
            font-size: 12px;
            padding: 7px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #fecaca;
        }

        /* Toast Notification الفخم */
        #toast {
            visibility: hidden;
            min-width: 240px;
            background-color: #0f172a;
            color: #fff;
            text-align: center;
            border-radius: 14px;
            padding: 14px 20px;
            position: fixed;
            z-index: 99;
            left: 50%;
            bottom: 35px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
        }

        #toast.show {
            visibility: visible;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1), fadeOut 0.35s cubic-bezier(0.16, 1, 0.3, 1) 2.3s;
        }

        @keyframes slideUp {
            from { bottom: 0; opacity: 0; transform: translateX(-50%) scale(0.9); }
            to { bottom: 35px; opacity: 1; transform: translateX(-50%) scale(1); }
        }

        @keyframes fadeOut {
            from { bottom: 35px; opacity: 1; transform: translateX(-50%) scale(1); }
            to { bottom: 0; opacity: 0; transform: translateX(-50%) scale(0.9); }
        }

        #generatorScreen {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        
        <!-- = شاشة تسجيل الدخول = -->
        <div id="loginScreen">
            <div class="brand-logo">
                <div class="security-badge">🔒 بوابة التراخيص المشفرة</div>
                <h1>APEXORA</h1>
                <p>تسجيل دخول المطور لإدارة التراخيص</p>
            </div>
            
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم..." autocomplete="off">
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور...">
            </div>

            <label class="checkbox-group">
                <input type="checkbox" id="rememberMe"> تذكرني على هذا الجهاز
            </label>

            <button type="button" class="btn-primary" onclick="checkLogin()">دخول آمن 🚀</button>
        </div>

        <!-- = شاشة التوليد الرئيسية = -->
        <div id="generatorScreen">
            <div class="top-bar">
                <div>
                    <h3 style="margin:0; font-size:15px; color:var(--primary);">مرحباً، بالمطور</h3>
                    <span style="font-size:11px; color:var(--text-muted);">جلسة نشطة وآمنة 100%</span>
                </div>
                <button type="button" class="logout-btn" onclick="logout()">خروج 🔒</button>
            </div>

            <div class="brand-logo" style="margin-bottom: 22px;">
                <h1 style="font-size: 22px;">Key Generator</h1>
            </div>

            <div class="form-group">
                <label>سريال هارد العميل (HDD)</label>
                <input type="text" id="clientHDD" placeholder="مثال: W-DXW1E8045173" autocomplete="off">
            </div>

            <div class="form-group">
                <label>تاريخ انتهاء الاشتراك</label>
                <input type="date" id="expiryDate">
            </div>

            <button type="button" class="btn-primary" onclick="processGeneration()">توليد كود التفعيل ⚡</button>

            <div class="result-area" id="resultContainer">
                <label>ملف التفعيل النهائي (Apexora.lic)</label>
                <textarea id="resultText" readonly></textarea>
                <div class="action-btns">
                    <button type="button" class="btn-sec" onclick="copyResult()">📋 نسخ</button>
                    <button type="button" class="btn-sec" onclick="downloadLicFile()">💾 تحميل</button>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- رسالة الإشعار المنبثقة (Toast) -->
<div id="toast">تم بنجاح!</div>

<script>
const ADMIN_USER = "admin";
const ADMIN_PASS = "MS1104kd8";

window.onload = function() {
    if (localStorage.getItem("apexora_logged") === "true") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("generatorScreen").style.display = "block";
    }
}

function showToast(message) {
    let x = document.getElementById("toast");
    x.innerText = message;
    x.className = "show";
    setTimeout(() => { x.className = x.className.replace("show", ""); }, 2650);
}

function checkLogin() {
    let u = document.getElementById("username").value.trim();
    let p = document.getElementById("password").value.trim();
    let remember = document.getElementById("rememberMe").checked;

    if (u === ADMIN_USER && p === ADMIN_PASS) {
        if (remember) {
            localStorage.setItem("apexora_logged", "true");
        }
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("generatorScreen").style.display = "block";
        showToast("✨ أهلاً بك يا بشمهندس، تم تسجيل الدخول");
    } else {
        showToast("❌ بيانات الدخول غير صحيحة!");
    }
}

function logout() {
    localStorage.removeItem("apexora_logged");
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("generatorScreen").style.display = "none";
    document.getElementById("loginScreen").style.display = "block";
    showToast("🔒 تم تسجيل الخروج بنجاح");
}

function parseArabicNumbers(str) {
    return str.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function GenerateLicenseKey(hardwareID, expiryDate) {
    let rawData = hardwareID.trim().toUpperCase() + "|" + expiryDate;
    let masterKey = "ApexoraSec2026_MasterKey#99!";
    let dynamicKey = masterKey + hardwareID.trim().toUpperCase();
    let hexResult = "";

    for (let i = 1; i <= rawData.length; i++) {
        let charCode = rawData.charCodeAt(i - 1);
        let dynChar = dynamicKey.charCodeAt(((i - 1) % dynamicKey.length));
        charCode = charCode ^ dynChar;
        charCode = (charCode + (i * 7)) % 256;
        let masChar = masterKey.charCodeAt((masterKey.length - ((i - 1) % masterKey.length)) - 1);
        charCode = charCode ^ masChar;

        let hexVal = charCode.toString(16).toUpperCase();
        if (hexVal.length < 2) hexVal = "0" + hexVal;
        hexResult += hexVal;
    }

    if (hexResult.length >= 20) {
        return "APX-" + hexResult.substring(0, 5) + "-" + hexResult.substring(5, 10) + "-" + hexResult.substring(10, 15) + "-" + hexResult.substring(15);
    } else {
        return "APX-" + hexResult;
    }
}

function processGeneration() {
    try {
        let hddInput = document.getElementById("clientHDD").value;
        let dateInput = document.getElementById("expiryDate").value;

        if (!hddInput || !hddInput.trim()) {
            showToast("⚠️ الرجاء إدخال سريال الهارد!");
            return;
        }

        if (!dateInput) {
            showToast("⚠️ الرجاء اختيار تاريخ الانتهاء!");
            return;
        }

        let cleanHDD = parseArabicNumbers(hddInput.trim());
        let finalKey = GenerateLicenseKey(cleanHDD, dateInput);
        let fullFileContent = "---APEXORA OFFICIAL LICENSE FILE---\n" + finalKey;

        document.getElementById("resultText").value = fullFileContent;
        document.getElementById("resultContainer").style.display = "block";
        showToast("⚡ تم توليد وتشفير كود التفعيل بنجاح");

    } catch (err) {
        showToast("❌ حدث خطأ أثناء المعالجة");
    }
}

function copyResult() {
    let txt = document.getElementById("resultText");
    txt.select();
    navigator.clipboard.writeText(txt.value).then(() => {
        showToast("📋 تم نسخ محتوى التفعيل إلى الحافظة");
    });
}

function downloadLicFile() {
    let content = document.getElementById("resultText").value;
    let blob = new Blob([content], { type: "application/octet-stream" });
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Apexora.lic";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast("💾 تم تحميل ملف Apexora.lic بنجاح");
}
</script>

</body>
</html>
